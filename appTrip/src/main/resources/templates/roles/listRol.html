<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Roles</title>
    <link th:href="@{/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Roles</h1>
        <div>
            <a class="btn btn-secondary" th:href="@{/}">Inicio</a>
            <a class="btn btn-primary" th:href="@{/roles/create}">Nuevo Rol</a>
        </div>
    </div>
    <table class="table table-striped table-bordered">
        <thead class="thead-dark">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Activo</th>
                <th>Fecha de creación</th>
                <th>Editar</th>
                <th>Borrar</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="rol : ${roles}">
                <td th:text="${rol.id}"></td>
                <td th:text="${rol.nomRol}"></td>
                <td th:text="${rol.descripcion}"></td>
                <td th:text="${rol.activo ? 'ACTIVO' : 'INACTIVO'}"></td>
                <td th:text="${rol.fecha}"></td>
                <td><a class="btn btn-warning btn-sm" th:href="@{/roles/edit(id=${rol.id})}">Editar</a></td>
                <td><a class="btn btn-danger btn-sm" th:href="@{/roles/delete(id=${rol.id})}">Borrar</a></td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
