<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle Trip</title>
    <link th:href="@{/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body>
<div class="container mt-4" th:if="${trip != null}">
    <a class="btn btn-secondary mb-3" th:href="@{/tabla}">Regresar</a>
    <div class="card">
        <div class="card-header">
            <h1 th:text="${trip.nomTrip}">Detalle del Trip</h1>
        </div>
        <div class="card-body">
            <img th:src="@{/images/{img}(img=${trip.imagen})}" class="img-fluid mb-3" style="max-height:300px; object-fit:cover;" alt="Trip">
            <p><strong>Descripción:</strong> <span th:text="${trip.descripcion}"></span></p>
            <p><strong>Detalles:</strong> <span th:text="${trip.detalles}"></span></p>
            <p><strong>Costo:</strong> $<span th:text="${trip.costo}"></span></p>
            <p><strong>Categoría:</strong> <span th:text="${trip.categoria != null ? trip.categoria.nomCategoria : 'Sin categoría'}"></span></p>
            <p><strong>Fecha:</strong> <span th:text="${trip.fecha}"></span></p>
            <h5>Usuarios que publican este Trip</h5>
            <ul>
                <li th:each="usuario : ${trip.usuarios}" th:text="${usuario.nomUsuario}">Usuario</li>
            </ul>
        </div>
    </div>
</div>
<div class="container mt-4" th:unless="${trip != null}">
    <div class="alert alert-warning">No se encontró el Trip solicitado.</div>
    <a class="btn btn-secondary" th:href="@{/tabla}">Regresar</a>
</div>
</body>
</html>
