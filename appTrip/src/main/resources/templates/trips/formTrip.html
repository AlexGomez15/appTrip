<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Crear Trip</title>
    <link th:href="@{/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1>Crear Trip</h1>
    <form th:action="@{/trips/save}" th:object="${trip}" method="post">
        <div class="form-group">
            <label>Nombre del Trip</label>
            <input type="text" class="form-control" th:field="*{nomTrip}" required>
        </div>
        <div class="form-group">
            <label>Descripción</label>
            <input type="text" class="form-control" th:field="*{descripcion}" required>
        </div>
        <div class="form-group">
            <label>Costo</label>
            <input type="number" step="0.01" class="form-control" th:field="*{costo}" required>
        </div>
        <div class="form-group">
            <label>Imagen</label>
            <select class="form-control" th:field="*{imagen}">
                <option value="trip01.png">trip01.png</option>
                <option value="trip02.png">trip02.png</option>
                <option value="tirp03.png">tirp03.png</option>
                <option value="no-image.png">no-image.png</option>
            </select>
        </div>
        <div class="form-group">
            <label>Detalles</label>
            <textarea class="form-control" th:field="*{detalles}" rows="4"></textarea>
        </div>
        <div class="form-group">
            <label>Categoría</label>
            <select class="form-control" th:field="*{categoria}" required>
                <option value="">Seleccione una categoría</option>
                <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.nomCategoria}"></option>
            </select>
        </div>
        <div class="form-group">
            <label>Usuarios</label>
            <select class="form-control" name="usuariosIds" multiple>
                <option th:each="usuario : ${usuarios}"
                        th:value="${usuario.id}"
                        th:selected="${selectedUsuarioIds.contains(usuario.id)}"
                        th:text="${usuario.nomUsuario}">
                </option>
            </select>
        </div>
        <div class="form-group form-check">
            <input type="checkbox" class="form-check-input" th:field="*{activo}">
            <label class="form-check-label">Activo</label>
        </div>
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a class="btn btn-secondary" th:href="@{/tabla}">Cancelar</a>
    </form>
</div>
</body>
</html>
