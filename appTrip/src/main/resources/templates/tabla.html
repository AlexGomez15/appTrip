<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tabla Trips</title>
    <link th:href="@{/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Listado de Trips</h1>
        <div>
            <a class="btn btn-secondary" th:href="@{/}">Inicio</a>
            <a class="btn btn-primary" th:href="@{/trips/create}">Nuevo Trip</a>
        </div>
    </div>
    <table class="table table-striped table-bordered">
        <thead class="thead-dark">
            <tr>
                <th>Logo</th>
                <th>ID</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Costo</th>
                <th>Categoría</th>
                <th>Activo</th>
                <th>Detalle</th>
                <th>Borrar</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="trip : ${trips}">
                <td><img th:src="@{/images/{img}(img=${trip.imagen})}" width="80" alt="trip"></td>
                <td th:text="${trip.id}">1</td>
                <td th:text="${trip.nomTrip}">Nombre</td>
                <td th:text="${trip.descripcion}">Descripción</td>
                <td>$<span th:text="${trip.costo}">0.00</span></td>
                <td th:text="${trip.categoria != null ? trip.categoria.nomCategoria : 'Sin categoría'}">Categoría</td>
                <td>
                    <span class="badge badge-success" th:if="${trip.activo}">ACTIVO</span>
                    <span class="badge badge-danger" th:unless="${trip.activo}">INACTIVO</span>
                </td>
                <td><a class="btn btn-info btn-sm" th:href="@{/trips/view/{id}(id=${trip.id})}">Detalle</a></td>
                <td><a class="btn btn-danger btn-sm" th:href="@{/trips/delete(id=${trip.id})}">Borrar</a></td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
