<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Categorías</title>
    <link th:href="@{/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Categorías Trip</h1>
        <div>
            <a class="btn btn-secondary" th:href="@{/}">Inicio</a>
            <a class="btn btn-primary" th:href="@{/categorias/create}">Nueva Categoría</a>
        </div>
    </div>
    <table class="table table-striped table-bordered">
        <thead class="thead-dark">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Activo</th>
                <th>Fecha</th>
                <th>Borrar</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="categoria : ${categorias}">
                <td th:text="${categoria.id}"></td>
                <td th:text="${categoria.nomCategoria}"></td>
                <td th:text="${categoria.descripcion}"></td>
                <td th:text="${categoria.activo ? 'ACTIVO' : 'INACTIVO'}"></td>
                <td th:text="${categoria.fecha}"></td>
                <td><a class="btn btn-danger btn-sm" th:href="@{/categorias/delete(id=${categoria.id})}">Borrar</a></td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
